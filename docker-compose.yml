services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: jhic_app

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      # Source code tetap tersinkron dengan Windows
      - ./:/var/www

      # Vendor disimpan di filesystem Docker Linux
      # agar Laravel tidak membaca ribuan file vendor
      # melalui filesystem Windows.
      - vendor_data:/var/www/vendor

    networks:
      - jhic

  db:
    image: mysql:8.0

    container_name: jhic_db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: jhic
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: jhic
      MYSQL_PASSWORD: jhic

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - jhic

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest

    container_name: jhic_phpmyadmin

    restart: unless-stopped

    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "8080:80"

    depends_on:
      - db

    networks:
      - jhic

  nginx:
    image: nginx:alpine

    container_name: jhic_nginx

    restart: unless-stopped

    ports:
      - "8001:80"

    volumes:
      # Source code
      - ./:/var/www

      # Nginx configuration
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - jhic


networks:
  jhic:
    driver: bridge


volumes:
  mysql_data:
  vendor_data: